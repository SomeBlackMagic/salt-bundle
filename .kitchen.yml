driver:
  name: docker
  use_sudo: false
  cap_add:
    - SYS_ADMIN
    - NET_ADMIN
    - SYS_PTRACE
  security_opt:
    - seccomp=unconfined
    - apparmor=unconfined
  volume:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    - <%= File.join(Dir.pwd, "test/integration/_fixtures") %>:/workspace:ro
    - <%= File.join(Dir.pwd, "salt_bundle") %>:/tmp/salt_bundle:ro
    - <%= File.join(Dir.pwd, "pyproject.toml") %>:/tmp/pyproject.toml:ro
    - <%= File.join(Dir.pwd, ".kitchen/docker_id_rsa") %>:/var/tmp/kitchen_id_rsa:ro
  run_options:
    workdir: /workspace
  cgroupns_mode: private
  binary: env DOCKER_BUILDKIT=0 docker
  build_context: false

provisioner:
  name: shell
  script: test/integration/provision.sh
  root_path: /var/tmp/kitchen

verifier:
  name: inspec
  sudo: true

transport:
  name: docker
  temp_dir: /var/tmp


platforms:
  - name: debian-12-salt-3006
    driver:
      image: ghcr.io/someblackmagic/salt-docker-images/kitchen-debian-12:3006.30
      run_command: /lib/systemd/systemd
      env:
        - container=docker
      tmpfs:
        - /run
        - /run/lock

  - name: debian-12-salt-3007
    driver:
      image: ghcr.io/someblackmagic/salt-docker-images/kitchen-debian-12:3007.17
      run_command: /lib/systemd/systemd
      env:
        - container=docker
      tmpfs:
        - /run
        - /run/lock

  - name: debian-12-salt-3008
    driver:
      image: ghcr.io/someblackmagic/salt-docker-images/kitchen-debian-12:3008.5
      run_command: /lib/systemd/systemd
      env:
        - container=docker
      tmpfs:
        - /run
        - /run/lock

  - name: ubuntu-2404-salt-3006
    driver:
      image: ghcr.io/someblackmagic/salt-docker-images/kitchen-ubuntu-2404:3006.30
      run_command: /lib/systemd/systemd
      env:
        - container=docker
      tmpfs:
        - /run
        - /run/lock

  - name: ubuntu-2404-salt-3007
    driver:
      image: ghcr.io/someblackmagic/salt-docker-images/kitchen-ubuntu-2404:3007.17
      run_command: /lib/systemd/systemd
      env:
        - container=docker
      tmpfs:
        - /run
        - /run/lock

  - name: ubuntu-2404-salt-3008
    driver:
      image: ghcr.io/someblackmagic/salt-docker-images/kitchen-ubuntu-2404:3008.5
      run_command: /lib/systemd/systemd
      env:
        - container=docker
      tmpfs:
        - /run
        - /run/lock


suites:
  - name: salt-call
    verifier:
      inspec_tests:
        - test/integration/salt-call
  - name: salt-ssh
    verifier:
      inspec_tests:
        - test/integration/salt-ssh
