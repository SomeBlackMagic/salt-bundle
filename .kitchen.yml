suites:
  - name: default
  - name: functional
    provisioner:
      script: test/integration/functional/provision.sh
      uploads:
        <%= File.join(Dir.pwd, "salt_bundle") %>: /tmp
        <%= File.join(Dir.pwd, "examples") %>: /tmp
        <%= File.join(Dir.pwd, "docs") %>: /tmp
        <%= File.join(Dir.pwd, "pyproject.toml") %>: /tmp/pyproject.toml
        <%= File.join(Dir.pwd, "test/functional") %>: /tmp/test_functional
    verifier:
      name: inspec
      sudo: true
