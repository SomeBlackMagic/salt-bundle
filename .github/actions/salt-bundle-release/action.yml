name: "Salt Bundle Release"
description: "Packages and publishes Salt formulas and extensions via salt-bundle with the GitHub release provider."

author: "wir-wolf"
branding:
  icon: "package"
  color: "blue"

inputs:
  packages-dir:
    description: >
      Path to a single package (formula or extension) or a directory
      containing multiple packages.  Each package must have a FORMULA
      or EXTENSION metadata file.
    required: true
    default: "."

  index-branch:
    description: "Branch where index.yaml will be committed."
    required: false
    default: "gh-pages"

  skip-packaging:
    description: "If true, skips archive creation and uses existing .tar.gz files."
    required: false
    default: "false"

  dry-run:
    description: "If true, previews the release without making changes."
    required: false
    default: "false"

  python-version:
    description: "Python version to use."
    required: false
    default: "3.10"

  salt-bundle-version:
    description: "salt-bundle package version constraint (pip format). Leave empty for latest."
    required: false
    default: ""

  version:
    description: >
      Override the package version (only for single-package mode).
      Useful when the version comes from a git tag.
    required: false
    default: ""

  token:
    description: "GitHub token for publishing. Defaults to the automatic GITHUB_TOKEN."
    required: false
    default: "${{ github.token }}"

runs:
  using: "composite"
  steps:

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "${{ inputs.python-version }}"

    - name: Install salt-bundle
      shell: bash
      run: |
        if [ -n "${{ inputs.salt-bundle-version }}" ]; then
          pip3 install --no-cache-dir "salt-bundle${{ inputs.salt-bundle-version }}"
        else
          pip3 install --no-cache-dir salt-bundle
        fi

    - name: Configure Git
      shell: bash
      run: |
        git config --global user.name  "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Run salt-bundle repo release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail

        PKG_DIR="${{ inputs.packages-dir }}"

        args=(
          --provider github
          --packages-dir "$PKG_DIR"
          --index-branch "${{ inputs.index-branch }}"
        )

        # Explicit flag or auto-detect: FORMULA/EXTENSION in root means single package
        if [ "${{ inputs.single }}" = "true" ] || [ -f "$PKG_DIR/FORMULA" ] || [ -f "$PKG_DIR/EXTENSION" ]; then
          args+=( --single )
        fi

        if [ -n "${{ inputs.version }}" ]; then
          args+=( --version "${{ inputs.version }}" )
        fi

        if [ "${{ inputs.skip-packaging }}" = "true" ]; then
          args+=( --skip-packaging )
        fi

        if [ "${{ inputs.dry-run }}" = "true" ]; then
          args+=( --dry-run )
        fi

        echo "::group::salt-bundle repo release"
        echo "salt-bundle repo release ${args[*]}"
        salt-bundle repo release "${args[@]}"
        echo "::endgroup::"
