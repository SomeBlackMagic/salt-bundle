name: Build DEB (salt python runtime)

on:
  push:
    tags:
      - "v*"

jobs:
  build-deb:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    env:
      PKG: salt-bundle
      INSTALL_ROOT: /opt/saltstack/salt-bundle
      SALT_PYTHON_VERSION: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip ruby ruby-dev build-essential

      - name: Install fpm
        run: sudo gem install --no-document fpm

      - name: Build wheel
        run: |
          python3 -m pip install --upgrade pip build
          python3 -m build --wheel

      - name: Vendor ONLY non-salt deps
        run: |
          mkdir vendor
          python3 -m pip install --target vendor \
            --platform manylinux_2_17_x86_64 \
            --implementation cp \
            --python-version "${SALT_PYTHON_VERSION/./}" \
            --abi "cp${SALT_PYTHON_VERSION/./}" \
            --only-binary=:all: \
            "pydantic>=2" \
            "pydantic-core" \
            "typing-extensions" \
            "annotated-types" \
            "semver>=3" \
            "click>=8"

      - name: Extract package to lib/
        run: |
          mkdir -p lib
          unzip -q dist/*.whl -d lib/

      - name: Prepare dist-info for Salt site-packages
        run: |
          mkdir -p site-packages
          # Copy ONLY .dist-info to Salt's site-packages for entry_points discovery
          # This allows importlib.metadata to find our entry_points while keeping
          # the actual code isolated in /opt/saltstack/salt-bundle/lib
          cp -r lib/salt_bundle-*.dist-info site-packages/

      - name: Prepare packaging scripts
        run: |
          DEB_SCRIPTS=salt_bundle/packaging/deb
          mkdir -p bin scripts usr-bin
          cp "$DEB_SCRIPTS/salt-bundle.sh" bin/salt-bundle
          chmod +x bin/salt-bundle
          cp "$DEB_SCRIPTS/postinst" scripts/postinst
          chmod +x scripts/postinst
          cp "$DEB_SCRIPTS/prerm" scripts/prerm
          chmod +x scripts/prerm
          ln -s /opt/saltstack/bin/salt-bundle usr-bin/salt-bundle

      - name: Build deb
        run: |
          fpm -s dir -t deb \
            -n "${PKG}" \
            -v "${VERSION}" \
            -a amd64 \
            --depends salt-common \
            --after-install scripts/postinst \
            --before-remove scripts/prerm \
            --prefix / \
            vendor/=/opt/saltstack/salt-bundle/vendor \
            lib/=/opt/saltstack/salt-bundle/lib \
            bin/salt-bundle=/opt/saltstack/bin/salt-bundle \
            usr-bin/salt-bundle=/usr/bin/salt-bundle \
            site-packages/=/opt/saltstack/salt/lib/python${SALT_PYTHON_VERSION}/site-packages/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: "*.deb"

      - name: Upload assets to existing release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$TAG_NAME" *.deb --repo "$GITHUB_REPOSITORY" --clobber
