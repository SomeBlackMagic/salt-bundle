name: Build DEB (salt python runtime)

on:
  push:
    tags:
      - "v*"

jobs:
  build-deb:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - salt_series: "3006"
            next_series: "3007"
            python_versions: "3.10 3.11"
          - salt_series: "3007"
            next_series: "3008"
            python_versions: "3.11"
          - salt_series: "3008"
            next_series: "3009"
            python_versions: "3.14"

    permissions:
      contents: write

    env:
      PKG: salt-bundle
      INSTALL_ROOT: /opt/saltstack/salt-bundle

    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip ruby ruby-dev build-essential

      - name: Install fpm
        run: sudo gem install --no-document fpm

      - name: Build wheel
        run: |
          python3 -m pip install --upgrade pip build
          python3 -m build --wheel

      - name: Vendor wheel dependencies
        run: |
          for python_version in ${{ matrix.python_versions }}; do
            python_abi="${python_version/./}"
            python3 -m pip install --target "vendor/python${python_version}" \
              --platform manylinux_2_17_x86_64 \
              --implementation cp \
              --python-version "$python_abi" \
              --abi "cp${python_abi}" \
              --only-binary=:all: \
              dist/*.whl
            # The application wheel is extracted to lib; keep only its dependencies here.
            rm -rf "vendor/python${python_version}/salt_bundle" \
              "vendor/python${python_version}"/salt_bundle-*.dist-info \
              "vendor/python${python_version}/bin"
          done

      - name: Extract package to lib/
        run: |
          mkdir -p lib
          unzip -q dist/*.whl -d lib/

      - name: Prepare packaging scripts
        run: |
          DEB_SCRIPTS=salt_bundle/packaging/deb
          mkdir -p bin scripts usr-bin
          cp "$DEB_SCRIPTS/salt-bundle.sh" bin/salt-bundle
          chmod +x bin/salt-bundle
          cp "$DEB_SCRIPTS/postinst" scripts/postinst
          chmod +x scripts/postinst
          cp "$DEB_SCRIPTS/prerm" scripts/prerm
          chmod +x scripts/prerm
          ln -s /opt/saltstack/bin/salt-bundle usr-bin/salt-bundle

      - name: Build deb
        run: |
          fpm -s dir -t deb \
            -n "${PKG}" \
            -v "${VERSION}" \
            --iteration "salt${{ matrix.salt_series }}" \
            -a amd64 \
            -p "salt-bundle_${VERSION}_salt${{ matrix.salt_series }}_amd64.deb" \
            --depends "salt-common (>= ${{ matrix.salt_series }})" \
            --depends "salt-common (<< ${{ matrix.next_series }})" \
            --after-install scripts/postinst \
            --before-remove scripts/prerm \
            --prefix / \
            vendor/=/opt/saltstack/salt-bundle/vendor \
            lib/=/opt/saltstack/salt-bundle/lib \
            bin/salt-bundle=/opt/saltstack/bin/salt-bundle \
            usr-bin/salt-bundle=/usr/bin/salt-bundle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: "*.deb"

      - name: Upload assets to existing release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$TAG_NAME" *.deb --repo "$GITHUB_REPOSITORY" --clobber
